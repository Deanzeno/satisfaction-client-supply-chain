# ════════════════════════════════════════════════════════════════
# Configuration Prometheus — Supply Chain Satisfaction des clients
# Auteurs : Zineddine HAMZAOUI & Thomas PALISSIER
# ════════════════════════════════════════════════════════════════

global:
  scrape_interval:     15s   # Collecte toutes les 15 secondes
  evaluation_interval: 15s   # Évaluation des règles toutes les 15 s
  scrape_timeout:      10s

scrape_configs:

  # ── API FastAPI (Étape 4 + Étape 5) ──────────────────────────
  # Le endpoint /metrics est exposé automatiquement par
  # prometheus-fastapi-instrumentator (voir main.py)
  # Métriques disponibles : nb de requêtes, durée, status codes
  - job_name: "fastapi_supply_chain"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: "supply-chain-api"
          environment: "production"

  # ── Prometheus lui-même ───────────────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
